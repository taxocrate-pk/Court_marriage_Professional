name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint new SEO pages
        run: >-
          npx eslint
          components/city-service-template.jsx
          app/services/online-nikah/karachi/page.js
          app/services/online-nikah/islamabad/page.js
          app/services/online-nikah/lahore/page.js
          app/services/online-nikah/rawalpindi/page.js
          app/services/cities-services/faisalabad/page.js
          app/privacy-policy/page.js
          app/terms-of-service/page.js
          app/not-found.js
          app/sitemap.js
          app/robots.js
      - name: Build application
        run: npm run build
